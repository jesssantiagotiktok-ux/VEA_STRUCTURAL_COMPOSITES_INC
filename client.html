<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEA Chat</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:600px;
    height:100%;
    background:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
}

.header{
    height:65px;
    min-height:65px;
    background:#126b35;
    color:white;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-size:20px;
    font-weight:bold;
}

.header small{
    display:block;
    font-size:12px;
    font-weight:normal;
    opacity:.85;
    margin-top:3px;
}

.header-title{
    line-height:1.1;
}

.name-screen{
    position:absolute;
    inset:0;
    z-index:20;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.name-box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

.name-box h2{
    margin:0 0 8px;
    color:#126b35;
}

.name-box p{
    color:#666;
    font-size:14px;
    margin-bottom:22px;
}

.name-box input{
    width:100%;
    height:50px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:0 15px;
    font-size:16px;
    outline:none;
}

.name-box input:focus{
    border-color:#126b35;
}

.name-box button{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#126b35;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:12px;
}

.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px;
    background:#f5f7f8;
}

.message{
    display:flex;
    margin:8px 0;
}

.message.client{
    justify-content:flex-end;
}

.message.admin,
.message.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:82%;
    padding:10px 13px;
    border-radius:15px;
    font-size:15px;
    line-height:1.4;
    word-wrap:break-word;
}

.client .bubble{
    background:#126b35;
    color:white;
    border-bottom-right-radius:4px;
}

.admin .bubble,
.bot .bubble{
    background:white;
    color:#222;
    border:1px solid #ddd;
    border-bottom-left-radius:4px;
}

.sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.7;
}

.time{
    font-size:10px;
    opacity:.55;
    margin-top:5px;
    text-align:right;
}

.chat-image{
    max-width:100%;
    max-height:350px;
    display:block;
    border-radius:10px;
    cursor:pointer;
}

.image-loading{
    padding:20px;
    text-align:center;
    color:#777;
    background:white;
    border-radius:10px;
}

.image-error{
    padding:12px;
    color:#a00;
    background:#fff0f0;
    border-radius:10px;
}

.input-area{
    min-height:65px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
}

.input-area input{
    flex:1;
    height:48px;
    border:1px solid #ccc;
    border-radius:24px;
    padding:0 16px;
    font-size:15px;
    outline:none;
}

.send-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#126b35;
    color:white;
    font-size:20px;
}

.status{
    position:absolute;
    right:12px;
    top:8px;
    font-size:10px;
    opacity:.8;
}

.hidden{
    display:none!important;
}
</style>

</head>

<body>

<div class="app">


<div class="header">
    <div class="header-title">
        VEA CHAT
        <small>VEA STRUCTURAL COMPOSITES INC.</small>
    </div>
</div>

<div id="nameScreen" class="name-screen">
    <div class="name-box">
        <h2>Welcome</h2>
        <p>Please enter your name to start chatting with VEA Structural Composites Inc.</p>

        <input id="nameInput" type="text" placeholder="Enter your name" maxlength="50">
        <button id="startBtn">START CHAT</button>
    </div>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
    <input id="messageInput" type="text" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn" class="send-btn">➤</button>
</div>


</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    push,
    onChildAdded,
    onValue,
    update
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

import {
    getStorage,
    ref as storageRef,
    getBytes,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js";


const firebaseConfig = {
    apiKey: "AIzaSyAA84vFwW2qoh-7dyiWL6NnKx7Pz-3tGHY",
    authDomain: "vea-chat.firebaseapp.com",
    projectId: "vea-chat",
    storageBucket: "vea-chat.firebasestorage.app",
    messagingSenderId: "955537420473",
    appId: "1:955537420473:web:d2f4919127ce947dce6b68",
    measurementId: "G-VGJ8Q608NV",
    databaseURL: "https://vea-chat-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);


/* =========================
   LOCAL CLIENT DATA
========================= */

let clientId = localStorage.getItem("veaClientId");

if(!clientId){
    clientId = "client_" + Date.now() + "_" + Math.random().toString(36).substring(2,10);
    localStorage.setItem("veaClientId",clientId);
}

let clientName = localStorage.getItem("veaClientName") || "";

const nameScreen = document.getElementById("nameScreen");
const nameInput = document.getElementById("nameInput");
const startBtn = document.getElementById("startBtn");
const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");


/* =========================
   INDEXEDDB
========================= */

const DB_NAME = "VEA_CHAT_DATABASE";
const DB_VERSION = 1;
const STORE_NAME = "photos";

function openPhotoDB(){

    return new Promise((resolve,reject)=>{

        const request = indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = function(e){

            const database = e.target.result;

            if(!database.objectStoreNames.contains(STORE_NAME)){

                const store = database.createObjectStore(
                    STORE_NAME,
                    {keyPath:"messageId"}
                );

                store.createIndex(
                    "clientId",
                    "clientId",
                    {unique:false}
                );
            }
        };

        request.onsuccess = ()=>resolve(request.result);

        request.onerror = ()=>reject(request.error);

    });
}


async function savePhotoToIndexedDB(messageId,blob,fileName){

    const database = await openPhotoDB();

    return new Promise((resolve,reject)=>{

        const transaction = database.transaction(
            STORE_NAME,
            "readwrite"
        );

        const store = transaction.objectStore(STORE_NAME);

        store.put({
            messageId:messageId,
            clientId:clientId,
            fileName:fileName || "photo.jpg",
            blob:blob,
            savedAt:Date.now()
        });

        transaction.oncomplete = ()=>{
            database.close();
            resolve(true);
        };

        transaction.onerror = ()=>{
            database.close();
            reject(transaction.error);
        };

    });
}


async function getPhotoFromIndexedDB(messageId){

    const database = await openPhotoDB();

    return new Promise((resolve,reject)=>{

        const transaction = database.transaction(
            STORE_NAME,
            "readonly"
        );

        const store = transaction.objectStore(STORE_NAME);

        const request = store.get(messageId);

        request.onsuccess = ()=>{
            database.close();
            resolve(request.result || null);
        };

        request.onerror = ()=>{
            database.close();
            reject(request.error);
        };

    });
}


/* =========================
   DISPLAY
========================= */

function scrollBottom(){

    setTimeout(()=>{
        chat.scrollTop = chat.scrollHeight;
    },50);

}


function formatTime(timestamp){

    if(!timestamp) return "";

    return new Date(timestamp).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function addTextMessage(message){

    const wrapper = document.createElement("div");

    wrapper.className =
        "message " +
        (
            message.sender === "client"
            ? "client"
            : message.sender === "bot"
            ? "bot"
            : "admin"
        );

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(message.sender === "admin"){

        const sender = document.createElement("div");
        sender.className = "sender";

        sender.textContent =
            "Admin (" +
            (message.adminName || "Admin") +
            ")";

        bubble.appendChild(sender);

    }else if(message.sender === "bot"){

        const sender = document.createElement("div");
        sender.className = "sender";

        sender.textContent = "VEA";

        bubble.appendChild(sender);
    }

    const text = document.createElement("div");
    text.textContent = message.text || "";

    bubble.appendChild(text);

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = formatTime(message.timestamp);

    bubble.appendChild(time);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    scrollBottom();
}


async function addImageMessage(message,messageId){

    const wrapper = document.createElement("div");

    wrapper.className =
        "message " +
        (message.sender === "client" ? "client" : "admin");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(message.sender === "admin"){

        const sender = document.createElement("div");
        sender.className = "sender";

        sender.textContent =
            "Admin (" +
            (message.adminName || "Admin") +
            ")";

        bubble.appendChild(sender);
    }

    const loading = document.createElement("div");
    loading.className = "image-loading";
    loading.textContent = "Receiving photo...";

    bubble.appendChild(loading);
    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    scrollBottom();

    try{

        let saved = await getPhotoFromIndexedDB(messageId);

        if(!saved){

            if(!message.imageUrl){

                throw new Error("Image URL missing");
            }

            const response = await fetch(message.imageUrl);

            if(!response.ok){

                throw new Error("Unable to receive photo");
            }

            const blob = await response.blob();

            await savePhotoToIndexedDB(
                messageId,
                blob,
                message.fileName || "photo.jpg"
            );

            saved = {
                blob:blob,
                fileName:message.fileName || "photo.jpg"
            };

            /*
             * Tell Firebase that the client has
             * successfully saved the photo.
             */
            await update(
                ref(
                    db,
                    "chats/" +
                    clientId +
                    "/messages/" +
                    messageId
                ),
                {
                    received:true,
                    savedLocally:true,
                    receivedAt:Date.now()
                }
            );

            /*
             * Delete Firebase Storage copy.
             */
            if(message.storagePath){

                try{

                    const fileRef =
                        storageRef(
                            storage,
                            message.storagePath
                        );

                    await deleteObject(fileRef);

                }catch(deleteError){

                    console.warn(
                        "Firebase Storage delete failed:",
                        deleteError
                    );

                }
            }
        }

        const imageURL =
            URL.createObjectURL(saved.blob);

        const img =
            document.createElement("img");

        img.className = "chat-image";
        img.src = imageURL;
        img.alt = saved.fileName || "Photo";

        img.onclick = ()=>{
            window.open(imageURL,"_blank");
        };

        loading.replaceWith(img);

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatTime(message.timestamp);

        bubble.appendChild(time);

        scrollBottom();

    }catch(error){

        console.error(error);

        loading.className = "image-error";
        loading.textContent =
            "Unable to save photo. It will be tried again.";

        scrollBottom();
    }
}


/* =========================
   LOCAL HISTORY
========================= */

function historyKey(){

    return "veaChat_" + clientId;

}


function loadLocalHistory(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(historyKey()) || "[]"
            );

        data.forEach(message=>{

            if(message.type === "image"){

                addImageMessage(message,message.id);

            }else{

                addTextMessage(message);

            }

        });

    }catch(error){

        console.error(
            "History load error:",
            error
        );

    }
}


function saveLocalMessage(message){

    try{

        const key = historyKey();

        const old =
            JSON.parse(
                localStorage.getItem(key) || "[]"
            );

        old.push(message);

        /*
         * Keep text/bot message history.
         * Images themselves are stored in IndexedDB.
         */
        localStorage.setItem(
            key,
            JSON.stringify(old.slice(-500))
        );

    }catch(error){

        console.warn(
            "Local history save failed:",
            error
        );

    }
}


/* =========================
   FIREBASE
========================= */

async function saveClientInfo(){

    await update(
        ref(db,"chats/"+clientId),
        {
            clientName:clientName,
            lastSeen:Date.now()
        }
    );

}


async function saveMessageToFirebase(message){

    const messageRef =
        push(
            ref(
                db,
                "chats/" +
                clientId +
                "/messages"
            )
        );

    const messageData = {
        ...message,
        clientName:clientName,
        timestamp:Date.now()
    };

    await set(messageRef,messageData);

    return {
        ...messageData,
        id:messageRef.key
    };
}


/* =========================
   AUTOMATIC REPLIES
========================= */

function getGreeting(){

    const hour = new Date().getHours();

    if(hour >= 5 && hour < 12){

        return "Good morning";

    }

    if(hour >= 12 && hour < 18){

        return "Good afternoon";

    }

    return "Good evening";
}


async function sendBotReply(text){

    const message = {
        sender:"bot",
        text:text,
        timestamp:Date.now()
    };

    saveLocalMessage(message);

    addTextMessage(message);

    /*
     * Also save bot reply in Firebase so admin
     * can see the conversation.
     */
    try{

        await saveMessageToFirebase({
            sender:"bot",
            text:text
        });

    }catch(error){

        console.error(error);

    }
}


async function handleAutomaticReply(){

    let history = [];

    try{

        history =
            JSON.parse(
                localStorage.getItem(historyKey()) || "[]"
            );

    }catch(e){}

    const clientMessages =
        history.filter(
            m=>m.sender === "client"
        ).length;

    if(clientMessages === 1){

        await sendBotReply(
            getGreeting() +
            " " +
            clientName +
            "!\n\n" +
            "Welcome to VEA STRUCTURAL COMPOSITES INC.\n\n" +
            "VEA STRUCTURAL COMPOSITES INC. is a consulting and construction company utilizing state-of-the-art technology with well-trained and highly motivated employees and workers.\n\n" +
            "How may I help you?"
        );

    }else{

        await sendBotReply(
            "For fast inquiry please contact:\n\n" +
            "📞 Contact: 0945-364-6446\n" +
            "✉️ Email: veacomposites@gmail.com\n" +
            "📘 Facebook: VEA Structural Composites Inc.\n\n" +
            "But if you want to continue, please wait for the admin to be online.\n\n" +
            "Thank You!"
        );

    }
}


/* =========================
   START CHAT
========================= */

function startChat(){

    const name =
        nameInput.value.trim();

    if(!name){

        alert("Please enter your name.");

        return;
    }

    clientName = name;

    localStorage.setItem(
        "veaClientName",
        clientName
    );

    nameScreen.classList.add("hidden");

    saveClientInfo();

    if(chat.children.length === 0){

        loadLocalHistory();

    }

    messageInput.focus();

}


startBtn.addEventListener(
    "click",
    startChat
);


nameInput.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter"){

            startChat();

        }

    }
);


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text) return;

    messageInput.value = "";

    const message = {
        sender:"client",
        text:text,
        timestamp:Date.now()
    };

    saveLocalMessage(message);

    addTextMessage(message);

    try{

        await saveMessageToFirebase({
            sender:"client",
            text:text
        });

        await handleAutomaticReply();

    }catch(error){

        console.error(error);

    }

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   RECEIVE ADMIN MESSAGES
========================= */

const messagesRef =
    ref(
        db,
        "chats/" +
        clientId +
        "/messages"
    );


onChildAdded(
    messagesRef,
    async snapshot=>{

        const message =
            snapshot.val();

        const messageId =
            snapshot.key;

        if(!message) return;

        /*
         * Bot messages are already displayed locally.
         */
        if(message.sender === "bot"){

            return;
        }

        /*
         * Client's own messages are already displayed locally.
         */
        if(message.sender === "client"){

            return;
        }

        if(message.sender === "admin"){

            if(message.type === "image"){

                /*
                 * Only add if not already in local history.
                 */
                let existing = false;

                try{

                    const history =
                        JSON.parse(
                            localStorage.getItem(historyKey()) || "[]"
                        );

                    existing =
                        history.some(
                            m=>m.id === messageId
                        );

                    if(!existing){

                        history.push({
                            ...message,
                            id:messageId
                        });

                        localStorage.setItem(
                            historyKey(),
                            JSON.stringify(history.slice(-500))
                        );
                    }

                }catch(e){}

                await addImageMessage(
                    message,
                    messageId
                );

            }else{

                let existing = false;

                try{

                    const history =
                        JSON.parse(
                            localStorage.getItem(historyKey()) || "[]"
                        );

                    existing =
                        history.some(
                            m=>m.id === messageId
                        );

                    if(!existing){

                        const saved = {
                            ...message,
                            id:messageId
                        };

                        saveLocalMessage(saved);

                        addTextMessage(saved);
                    }

                }catch(e){}

            }

        }

    }
);


/* =========================
   CHAT DELETE DETECTION
========================= */

onValue(
    ref(db,"chats/"+clientId),
    snapshot=>{

        if(!snapshot.exists()){

            /*
             * Firebase chat was deleted by admin.
             * Clear only chat history.
             *
             * IndexedDB photos are kept locally.
             */
            localStorage.removeItem(
                historyKey()
            );

            chat.innerHTML = "";

        }

    }
);


/* =========================
   INITIALIZE
========================= */

if(clientName){

    nameScreen.classList.add("hidden");

    loadLocalHistory();

    saveClientInfo();

}else{

    nameScreen.classList.remove("hidden");

}

</script>

</body>
</html>
